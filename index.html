<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="theme-color" content="#09090b" />

        window.addEventListener('load', () => {

          });
        });
